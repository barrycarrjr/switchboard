name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { throw "Tag v$tag does not match package.json version $pkg" }

      - run: npm ci
      - run: npm run icons
      - run: npm test
      # Stamp the publishing repository into the packaged app so installed copies
      # know where updates live; the committed source stays name-free. Invoked
      # directly (not via npm run) because npm splits the -c.key=value argument.
      - run: npx electron-builder --win nsis --publish never "-c.extraMetadata.updateRepo=${{ github.repository }}"

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Switchboard-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
